name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "manifest.json", "icon-*.png", "sounds/*", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Web files
        run: |
          mkdir -p www
          cp index.html manifest.json icon-192.png icon-512.png icon-maskable.png www/
          mkdir -p www/sounds && cp sounds/*.wav www/sounds/
          sed -i "s|var APK_BUILD=0/\*APKBUILD\*/;|var APK_BUILD=${{ github.run_number }};|" www/index.html
          grep -c "APK_BUILD=${{ github.run_number }}" www/index.html
      - name: Capacitor
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          python3 - <<'PY'
          p="node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/LocalNotificationManager.java"
          s=open(p,encoding="utf8").read()
          k="mBuilder.setContentIntent(pendingIntent);"
          assert k in s, "plugin source changed"
          s=s.replace(k,k+"\n        mBuilder.setFullScreenIntent(pendingIntent, true).setCategory(NotificationCompat.CATEGORY_ALARM).setPriority(NotificationCompat.PRIORITY_MAX);",1)
          open(p,"w",encoding="utf8").write(s)
          PY
          python3 - <<'PY'
          p="node_modules/@capacitor/local-notifications/android/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf8").read()
          k='<action android:name="android.intent.action.BOOT_COMPLETED" />'
          assert k in s, "manifest changed"
          s=s.replace(k,k+'\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />',1)
          open(p,"w",encoding="utf8").write(s)
          PY
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.islamgraphic.nota","appName":"النوتة","webDir":"www","server":{"androidScheme":"https"},"android":{"backgroundColor":"#f6f8fc"}}
          JSON
          npx cap add android
          cat > android/app/src/main/java/com/islamgraphic/nota/MainActivity.java <<'JAVA'
          package com.islamgraphic.nota;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private void alarmFlags(Intent i) {
              if (i != null && i.hasExtra("LocalNotificationId")) {
                if (android.os.Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
                else getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
            }
            @Override public void onCreate(Bundle b) { super.onCreate(b); alarmFlags(getIntent()); }
            @Override protected void onNewIntent(Intent i) { super.onNewIntent(i); alarmFlags(i); }
          }
          JAVA
          npx cap sync android
      - name: Permissions and icons
        run: |
          mkdir -p android/app/src/main/res/raw && cp sounds/*.wav android/app/src/main/res/raw/
          M=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf8").read()
          add=""
          for perm in ["POST_NOTIFICATIONS","VIBRATE","RECEIVE_BOOT_COMPLETED","SCHEDULE_EXACT_ALARM","USE_EXACT_ALARM","WAKE_LOCK","USE_FULL_SCREEN_INTENT"]:
              line='<uses-permission android:name="android.permission.%s" />'%perm
              if line not in s: add+="    "+line+"\n"
          s=s.replace("</manifest>",add+"</manifest>")
          open(p,"w",encoding="utf8").write(s)
          PY
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          R="android/app/src/main/res/"
          for n,a,f in [("mdpi",48,108),("hdpi",72,162),("xhdpi",96,216),("xxhdpi",144,324),("xxxhdpi",192,432)]:
              i=Image.open("icon-512.png").convert("RGBA"); m=Image.open("icon-maskable.png").convert("RGBA")
              i.resize((a,a),Image.LANCZOS).save(R+"mipmap-%s/ic_launcher.png"%n)
              i.resize((a,a),Image.LANCZOS).save(R+"mipmap-%s/ic_launcher_round.png"%n)
              m.resize((f,f),Image.LANCZOS).save(R+"mipmap-%s/ic_launcher_foreground.png"%n)
          PY
          sed -i 's/#FFFFFF/#e3e9f3/I' android/app/src/main/res/values/ic_launcher_background.xml || true
      - name: Version code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Signing key (kept in cache so updates install over the old app)
        id: key
        uses: actions/cache@v4
        with:
          path: nota.keystore
          key: nota-keystore-v1
      - name: Make key if missing
        run: |
          [ -f nota.keystore ] || keytool -genkeypair -keystore nota.keystore -storepass notapass -keypass notapass -alias nota -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Nota"
      - name: Build
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -q
          cd ..
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign --ks nota.keystore --ks-pass pass:notapass --key-pass pass:notapass --ks-key-alias nota --out nota.apk $APK
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest nota.apk --title "النوتة (أندرويد)" --notes "build:${{ github.run_number }} — نزّل nota.apk وثبّته. آخر بناء: $(date -u +%F' '%H:%M) UTC"
