name: Build Windows desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", "index.html", ".github/workflows/desktop.yml"]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bundle the notes app into the program
        working-directory: .
        run: cp index.html desktop/src/nota-app.html
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - name: Publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "desktop/release/Nota Widget Setup 1.0.0.exe" Nota-Widget-Setup.exe
          gh release delete desktop-latest -y --cleanup-tag || true
          gh release create desktop-latest Nota-Widget-Setup.exe --title "النوتة - برنامج ويندوز" --notes "build:${{ github.run_number }} — نزّل Nota-Widget-Setup.exe وشغّله. آخر بناء: $(date -u +%F' '%H:%M) UTC"
