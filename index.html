<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e3e9f3">
<meta name="color-scheme" content="only light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="النوتة">
<title>النوتة</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232447c9'/%3E%3Cpath d='M18 33l10 10 18-22' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a ruled school notebook (كشكول) — blue rules, red margin on the right,
   coloured divider tabs for lists, a pen strike for finished points. One screen, composer pinned at the bottom. */
:root{
  --paper:#f6f8fc;
  --desk:#e3e9f3;
  --rule:#c7d6ee;
  --margin:#e0556b;
  --ink:#1b2a4a;
  --muted:#6f7c95;
  --accent:#2447c9;
  --pen:#d8334f;
  --on-accent:#ffffff;
  --t0:#2f5fd0; --t1:#c8415a; --t2:#1f8a61; --t3:#a26a00; --t4:#7350c4;
  --display:"Aref Ruqaa","Amiri","Traditional Arabic",serif;
  --body:"Readex Pro","Segoe UI","Tahoma","Noto Sans Arabic",sans-serif;
  --pitch:36px;
  color-scheme:light;
  --gutter:52px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 18px 8px}
.top h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;text-wrap:balance}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--t2)}
.sync.bad i{background:var(--pen)}

/* divider tabs */
.tabs{display:flex;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none;align-items:flex-end}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px 7px;border-radius:10px 10px 0 0;
  background:color-mix(in srgb,var(--tc) 14%,var(--paper));border-top:3px solid var(--tc);font-weight:500;font-size:15px;white-space:nowrap}
.tab .n{font-size:12px;font-variant-numeric:tabular-nums;min-width:20px;text-align:center;padding:1px 6px;border-radius:9px;
  background:color-mix(in srgb,var(--tc) 22%,var(--paper))}
.tab[aria-selected="true"]{background:var(--paper);padding-bottom:11px;font-weight:600}
.tab.add{border-top-color:var(--muted);background:transparent;color:var(--muted);padding-inline:12px;font-size:20px;line-height:1}

/* the page */
.page{flex:1;min-height:0;overflow-y:auto;background-color:var(--paper);
  background-image:
    linear-gradient(to left,transparent calc(var(--gutter) - 1px),var(--margin) calc(var(--gutter) - 1px),var(--margin) var(--gutter),transparent var(--gutter)),
    linear-gradient(to bottom,transparent calc(var(--pitch) - 1px),var(--rule) calc(var(--pitch) - 1px));
  background-size:100% 100%,100% var(--pitch);
  background-attachment:scroll,local;
  border-radius:0}
.head{display:flex;align-items:center;justify-content:space-between;height:calc(var(--pitch)*2);padding-inline:calc(var(--gutter) + 12px) 12px}
.head h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:calc(var(--pitch)*2);color:var(--tc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head button{font-size:13px;color:var(--muted);padding:6px 10px;border:1px solid var(--rule);border-radius:16px;background:var(--paper);flex:0 0 auto}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:flex-start;min-height:var(--pitch);padding-inline-end:12px}
.chk{flex:0 0 var(--gutter);height:var(--pitch);display:grid;place-items:center}
.chk span{width:22px;height:22px;border-radius:50%;border:2px solid var(--tc);display:grid;place-items:center;background:var(--paper);transition:background .15s}
.chk span::after{content:"";width:10px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.done .chk span{background:var(--tc)}
.done .chk span::after{opacity:1}
.txt-btn{position:relative;flex:0 1 auto;min-width:0;text-align:start;padding-inline:12px 4px;line-height:var(--pitch);font-size:17px;overflow-wrap:anywhere}
.done .txt-btn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px}
.row.fresh.done .txt-btn{animation:fade .5s both}
.row.fresh.done .txt-btn::after{content:"";position:absolute;inset-inline:8px 0;top:calc(var(--pitch)/2 + 1px);height:2px;background:var(--pen);
  transform-origin:right;animation:stroke .5s ease-out both}
@keyframes stroke{0%{transform:scaleX(0);opacity:1}60%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes fade{0%,55%{color:var(--ink);text-decoration-color:transparent}100%{color:var(--muted);text-decoration-color:var(--pen)}}
.sep{display:flex;align-items:center;justify-content:space-between;height:var(--pitch);padding-inline:calc(var(--gutter) + 12px) 12px;font-size:13px;color:var(--muted)}
.sep button{color:var(--pen);font-size:13px;padding:4px 6px}
.note{padding-inline:calc(var(--gutter) + 12px) 16px;line-height:var(--pitch);font-family:var(--display);font-size:20px;color:var(--muted);margin:0}

/* composer */
.compose{background:var(--paper);border-top:1px solid var(--rule);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.compose form{display:flex;gap:8px;align-items:center}
.compose input{flex:1;min-width:0;height:46px;border:1.5px solid var(--rule);border-radius:23px;background:var(--paper);padding:0 16px;font-size:16px}
.compose input:focus{outline:0;border-color:var(--accent)}
.round{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.send{background:var(--accent);color:var(--on-accent)}
.mic{border:1.5px solid var(--accent);color:var(--accent)}
.mic.on{background:var(--pen);border-color:var(--pen);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--pen) 22%,transparent)}}
.round svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;color:var(--muted);margin:0;padding-inline:6px;min-height:0}
[hidden]{display:none!important}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{width:100%;max-width:720px;background:var(--paper);border-radius:18px 18px 0 0;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-size:24px}
.sheet label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sheet input,.sheet select{height:46px;border:1.5px solid var(--rule);border-radius:12px;background:var(--paper);padding:0 12px;font-size:16px;width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:22px;border:1.5px solid var(--rule);font-weight:500}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:1}
.btn.danger{color:var(--pen);border-color:color-mix(in srgb,var(--pen) 45%,var(--paper))}
.toast{position:fixed;inset-inline:16px;bottom:96px;margin:0 auto;max-width:420px;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:14px;z-index:9;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:760px){.app{padding-top:12px}.page{border-inline:1px solid var(--rule)}}
/* additions for the standalone app */
.top .right{display:flex;align-items:center;gap:10px}
.gear{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--rule);background:var(--paper)}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.head .acts{display:flex;gap:6px;flex:0 0 auto}
.head button.ai{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--paper))}
.chip{align-self:flex-start;font-size:13px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--paper));border-radius:16px;padding:6px 12px;background:var(--paper)}
.sheet{max-height:88%;overflow-y:auto}
.sheet textarea{border:1.5px solid var(--rule);border-radius:12px;background:var(--paper);padding:10px 12px;font:inherit;font-size:14px;color:inherit;width:100%;min-height:110px;direction:ltr;text-align:left;resize:vertical}
.sheet .ltr{direction:ltr;text-align:left}
.sheet p{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
.sheet h4{margin:6px 0 0;font-size:15px;font-weight:600}
.sheet hr{border:0;border-top:1px solid var(--rule);margin:4px 0;width:100%}
.out{white-space:pre-wrap;font-size:15px;line-height:1.9;color:var(--ink);background:color-mix(in srgb,var(--accent) 6%,var(--paper));border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.pts{display:flex;flex-direction:column;gap:2px}
.pts label{flex-direction:row;align-items:flex-start;gap:10px;font-size:15px;color:var(--ink);line-height:1.7;padding:6px 0;border-bottom:1px solid var(--rule)}
.pts input[type="checkbox"]{width:20px;height:20px;flex:0 0 20px;margin-top:4px;accent-color:var(--accent);padding:0}
.btn[disabled]{opacity:.5}
.mic.busy{opacity:.6}
.hl{display:flex;justify-content:space-between;align-items:center;height:var(--pitch);margin-top:var(--pitch);padding-inline:calc(var(--gutter) + 12px) 12px}
.hl .name{font-family:var(--display);font-size:24px;font-weight:700;color:var(--tc);line-height:var(--pitch)}
.hl span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.more{display:block;height:var(--pitch);line-height:var(--pitch);padding-inline:calc(var(--gutter) + 12px) 12px;font-size:13px;color:var(--muted);text-align:start;width:100%}
.ord{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule)}
.ord span{flex:1;font-weight:500;color:var(--tc)}
.mv{width:40px;height:40px;border:1.5px solid var(--rule);border-radius:10px}
.mv[disabled]{opacity:.35}
.pts small{color:var(--muted);font-size:12px}
.tab{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tab.drag{position:relative;z-index:2;transform:translateY(-3px) scale(1.06);box-shadow:0 6px 16px rgba(20,30,60,.28);outline:2px solid var(--tc)}
/* phone fit */
html,body{overflow:hidden;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
.top{align-items:center;gap:8px;padding:10px 14px 6px}
.top h1{flex:0 0 auto;font-size:30px}
.top .right{min-width:0;flex:0 1 auto}
.sync{min-width:0}
.sync i{flex:0 0 8px}
.sync span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{flex:0 0 36px}
.head{display:block;height:auto;padding-inline:calc(var(--gutter) + 12px) 12px}
.head h2{font-size:28px;line-height:calc(var(--pitch)*2);height:calc(var(--pitch)*2)}
.head .acts{height:var(--pitch);align-items:center;gap:8px}
.head .acts button{padding:3px 12px;font-size:13px;line-height:20px;white-space:nowrap}
.hl{gap:8px}
.hl .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl span{flex:0 0 auto;white-space:nowrap}
.compose input{font-size:16px;text-overflow:ellipsis}
.tab{font-size:14px;padding-inline:12px}
@media (max-width:380px){.note{font-size:18px}.txt-btn{font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>النوتة</h1>
    <div class="right">
      <div class="sync" id="sync"><i></i><span id="syncText">على الجهاز ده</span></div>
      <button class="gear" id="gear" aria-label="الإعدادات">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.8-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.8 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.8h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.1z"/></svg>
      </button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="اللستات"></nav>
  <main class="page" id="page"></main>
  <div class="compose">
    <form id="form" autocomplete="off">
      <button type="button" class="round mic" id="mic" hidden aria-label="سجّل صوت">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <input id="text" type="text" placeholder="اكتب ملاحظة…" aria-label="ملاحظة جديدة" enterkeyhint="done">
      <button type="submit" class="round send" id="send" aria-label="ضيف الملاحظة">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
    <button type="button" class="chip" id="install" hidden>نزّل النوتة كتطبيق على الجهاز</button>
    <button type="button" class="chip" id="split" hidden>حوّل الكلام ده لنقط</button>
    <p class="hint" id="hint" hidden></p>
  </div>
</div>
<div id="layer"></div>

<script>
(function(){
"use strict";
var COLORS=5,FBV="https://www.gstatic.com/firebasejs/12.9.0/";
var HOME="__home",S={lists:[],tasks:[],cur:HOME,fresh:null};
var FB=null,cloud=null,migrated=false;
var $=function(id){return document.getElementById(id)};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
        set:function(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}};

function h(tag,props){
  var e=document.createElement(tag),i,k;
  if(props)for(k in props){
    if(k==="text")e.textContent=props[k];
    else if(k==="on")for(i in props.on)e.addEventListener(i,props.on[i]);
    else if(k==="style")e.setAttribute("style",props[k]);
    else if(props[k]!==null&&props[k]!==undefined&&props[k]!==false)e.setAttribute(k,props[k]===true?"":props[k]);
  }
  for(i=2;i<arguments.length;i++){var c=arguments[i];if(c)e.appendChild(typeof c==="string"?document.createTextNode(c):c)}
  return e;
}
function tc(l){return "--tc:var(--t"+((l&&l.color)||0)%COLORS+")"}
function curList(){for(var i=0;i<S.lists.length;i++)if(S.lists[i].id===S.cur)return S.lists[i];return null}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function isCloud(){return !!(cloud&&cloud.user)}
function setSync(kind,text){$("sync").className="sync "+kind;$("syncText").textContent=text}

/* ---------- sound ---------- */
var ac=null;
function sound(done){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    var t=ac.currentTime;
    if(done){
      var len=Math.floor(ac.sampleRate*0.14),buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);
      for(var i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
      var src=ac.createBufferSource(),bp=ac.createBiquadFilter(),ng=ac.createGain();
      src.buffer=buf;bp.type="bandpass";bp.frequency.value=3200;bp.Q.value=0.8;ng.gain.value=0.12;
      src.connect(bp);bp.connect(ng);ng.connect(ac.destination);src.start(t);
    }
    (done?[784,1175]:[392]).forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain(),s=t+(done?0.1:0)+i*0.08;
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,s);g.gain.linearRampToValueAtTime(0.16,s+0.012);g.gain.exponentialRampToValueAtTime(0.0001,s+0.4);
      o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+0.45);
    });
  }catch(e){}
}

/* ---------- toast ---------- */
var toastT=null;
function toast(msg){
  var old=document.querySelector(".toast");if(old)old.remove();
  document.body.appendChild(h("div",{class:"toast",role:"status",text:msg}));
  clearTimeout(toastT);toastT=setTimeout(function(){var t=document.querySelector(".toast");if(t)t.remove()},4000);
}
function fail(e){
  toast(e&&e.code==="permission-denied"?"Firebase رفض الحفظ. راجع قواعد Firestore من الإعدادات.":"ماتحفظش. شوف النت وجرب تاني.");
}

/* ---------- storage: this device ---------- */
function readLocal(){
  try{var d=JSON.parse(LS.get("nota.data")||"null");if(d&&d.lists&&d.tasks)return d}catch(e){}
  return {lists:[{id:"shop",name:"المحل",color:0,order:1},{id:"wishes",name:"الأمنيات",color:1,order:2},{id:"abu-fahd",name:"شغل أبو فهد",color:2,order:3}],tasks:[]};
}
function useLocal(){var d=readLocal();S.lists=d.lists;S.tasks=d.tasks}
function saveLocal(){LS.set("nota.data",JSON.stringify({lists:S.lists,tasks:S.tasks}))}

/* ---------- storage: Firebase ---------- */
var DEFAULT_CFG={apiKey:"AIzaSyCKuWX_cu78l_e3h85Av6Jn0CukDF98kHE",authDomain:"nota-islam.firebaseapp.com",projectId:"nota-islam",storageBucket:"nota-islam.firebasestorage.app",messagingSenderId:"782390960025",appId:"1:782390960025:web:198c2a8c843aff3f62fd08"};
function getCfg(){try{var c=JSON.parse(LS.get("nota.fb")||"null");return c&&c.apiKey&&c.projectId?c:DEFAULT_CFG}catch(e){return DEFAULT_CFG}}
function parseCfg(txt){
  var c={},re=/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g,m;
  while((m=re.exec(txt)))c[m[1]]=m[2];
  return c.apiKey&&c.projectId?c:null;
}
function ref(kind,id){return FB.fs.doc(cloud.db,"users",cloud.user.uid,kind,id)}
function connect(){
  var cfg=getCfg();if(!cfg)return;
  setSync("","بيتصل…");
  Promise.all([import(FBV+"firebase-app.js"),import(FBV+"firebase-auth.js"),import(FBV+"firebase-firestore.js")]).then(function(m){
    FB={app:m[0],auth:m[1],fs:m[2]};
    var app=FB.app.initializeApp(cfg),fdb;
    try{fdb=FB.fs.initializeFirestore(app,{localCache:FB.fs.persistentLocalCache({tabManager:FB.fs.persistentMultipleTabManager()})})}
    catch(e){fdb=FB.fs.getFirestore(app)}
    cloud={auth:FB.auth.getAuth(app),db:fdb,user:null,unsub:[]};
    FB.auth.onAuthStateChanged(cloud.auth,onUser);
  }).catch(function(){cloud=null;setSync("bad","على الجهاز ده بس")});
}
function onUser(u){
  cloud.unsub.forEach(function(f){f()});cloud.unsub=[];cloud.user=u;
  if(!u){useLocal();setSync("bad","سجّل دخول");render();return}
  setSync("","بيحمّل…");
  var fs=FB.fs,base=["users",u.uid],got={lists:false,tasks:false};
  function listen(kind){
    cloud.unsub.push(fs.onSnapshot(fs.collection(cloud.db,base[0],base[1],kind),{includeMetadataChanges:true},function(snap){
      S[kind]=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
      if(kind==="lists")S.lists.sort(function(a,b){return (a.order||0)-(b.order||0)});
      got[kind]=true;
      if(kind==="lists"&&snap.empty&&!snap.metadata.fromCache&&!migrated){migrated=true;upload()}
      if(got.lists&&got.tasks){

function dragMove(x){

  var others=bar.querySelectorAll(".tab[data-id]");

    var b=o.getBoundingClientRect();

var GAPI="https://generativelanguage.googleapis.com/v1beta/models";
function ver(n){var m=/gemini-(\d+(?:\.\d+)?)/.exec(n);return m?parseFloat(m[1]):0}
function models(key){
  var saved=LS.get("nota.gmodel");
  var fallback=["gemini-3.8-flash","gemini-3.5-flash-lite","gemini-2.5-flash","gemini-2.5-flash-lite"];
  return fetch(GAPI+"?pageSize=200",{headers:{"x-goog-api-key":key}}).then(function(r){return r.ok?r.json():{models:[]}},function(){return {models:[]}}).then(function(j){
    var list=(j.models||[]).filter(function(m){
      return (m.supportedGenerationMethods||[]).indexOf("generateContent")>=0&&/flash/.test(m.name)&&!/tts|image|live|audio|embed|preview|exp/.test(m.name);
    }).map(function(m){return m.name.replace("models/","")})
      .sort(function(a,b){return ver(b)-ver(a)||(/lite/.test(a)?1:0)-(/lite/.test(b)?1:0)}).slice(0,5);
    if(!list.length)list=fallback;
    if(saved){list=list.filter(function(m){return m!==saved});list.unshift(saved)}
    return list;
  });

function gemini(parts){
  var key=LS.get("nota.gkey");

  return models(key).then(function(list){
    var i=0,last="";
    function next(){
      if(i>=list.length)return Promise.reject({msg:last||"Gemini مردش."});
      var m=list[i++];
      return fetch(GAPI+"/"+m+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
        body:JSON.stringify({contents:[{role:"user",parts:parts}]})}).then(function(r){
        return r.json().catch(function(){return {}}).then(function(j){
          if(r.ok){
            var c=j.candidates&&j.candidates[0],t=c&&c.content&&c.content.parts?c.content.parts.map(function(p){return p.text||""}).join(""):"";
            if(!t){last="Gemini رجّع رد فاضي.";return next()}
            LS.set("nota.gmodel",m);return t.trim();
          }
          var em=(j.error&&j.error.message)||"";
          if(/API key/i.test(em)||r.status===401||r.status===403)return Promise.reject({msg:"مفتاح Gemini مش مظبوط. راجعه من الإعدادات."});
          last=r.status===429?"حد الاستخدام المجاني خلص دلوقتي. جرب بعد شوية.":"Gemini رفض الطلب ("+r.status+").";
          return next();

    }

  });
}
function aiErr(e){return e&&e.nokey?"حط مفتاح Gemini من الإعدادات الأول.":(e&&e.msg)||"حصلت مشكلة. جرب تاني."}

function aiSheet(l){
  var mine=l?S.tasks.filter(function(t){return t.listId===l.id}):S.tasks.slice();
  var names={};S.lists.forEach(function(x){names[x.id]=x.name});
  var title=l?l.name:"كل اللستات";
  var out=h("div",{class:"out",hidden:true,"aria-live":"polite"});
  var b1,b2;
  function run(kind){
    if(!mine.length){out.hidden=false;out.textContent="اللستة فاضية، مفيش حاجة تتلخص.";return}
    var body=mine.map(function(t){return (l?"":"("+(names[t.listId]||"")+") ")+(t.done?"[خلصت] ":"[لسه] ")+t.text}).join("\n");
    var ask=kind==="sum"
      ?"لخّص لستة الملاحظات دي في كام سطر قصير بالعامية المصرية: إيه أهم اللي فيها، إيه اللي خلص وإيه اللي لسه."
      :"حلّل لستة الملاحظات دي بالعامية المصرية: رتّب اللي لسه ماخلصش حسب الأولوية مع سبب قصير لكل واحدة، جمّع المتشابه، ونبّه لو فيه حاجة ناقصة أو مش واضحة، واقترح أول خطوة أبدأ بيها.";
    b1.disabled=b2.disabled=true;out.hidden=false;out.textContent="بفكر…";
    gemini([{text:ask+"\nاكتب نص عادي من غير علامات ماركداون أو نجوم.\n"+(l?"اسم اللستة: "+title:"دي كل اللستات، وقبل كل سطر اسم اللستة بين قوسين. اتكلم عن كل لستة لوحدها باختصار.")+"\n\n"+body}])
      .then(function(t){out.textContent=t.replace(/\*\*/g,"")},function(e){out.textContent=aiErr(e)})
      .then(function(){b1.disabled=b2.disabled=false});
  }
  b1=h("button",{type:"button",class:"btn main",text:l?"لخّص اللستة":"لخّص الكل",on:{click:function(){run("sum")}}});
  b2=h("button",{type:"button",class:"btn main",text:"حلّل ورتّب الأولويات",on:{click:function(){run("ana")}}});
  openSheet(h("div",{class:"sheet"},
    h("h3",{text:"«"+title+"»"}),
    LS.get("nota.gkey")?null:h("p",{text:"التلخيص محتاج مفتاح Gemini. حطه من الإعدادات (الترس فوق)."}),
    h("div",{class:"btns"},b1,b2),out,
    h("div",{class:"btns"},h("button",{type:"button",class:"btn",text:"قفل",on:{click:closeSheet}}))),true);
}
function splitSheet(text){
  var body=h("div",{class:"pts"}),sum=h("div",{class:"out",text:"بحوّل الكلام لنقط…","aria-live":"polite"});
  var add=h("button",{type:"button",class:"btn main",text:"ضيف المتعلّم عليهم",disabled:true,on:{click:function(){
    var picks=[].slice.call(body.querySelectorAll("input:checked")).map(function(c){return c.value});
    picks.reverse().forEach(function(p,i){addTask(p,i)});
    $("text").value="";base="";chip();closeSheet();
  }}});
  openSheet(h("div",{class:"sheet"},h("h3",{text:"الكلام بعد التلخيص"}),sum,body,
    h("div",{class:"btns"},add,h("button",{type:"button",class:"btn",text:"إلغاء",on:{click:closeSheet}}))),true);
  gemini([{text:"الكلام ده ملاحظة اتقالت بالصوت أو اتكتبت بسرعة. طلّع منها: summary ملخص من سطر واحد بالعامية المصرية، و points قايمة بالمهام أو الأفكار المنفصلة اللي فيها، كل واحدة جملة قصيرة واضحة بنفس لغة صاحبها ومن غير تكرار. رجّع JSON بس بالشكل ده من غير أي كلام تاني: {\"summary\":\"...\",\"points\":[\"...\"]}\n\nالكلام:\n"+text}])
  .then(function(t){
    var o=null;try{o=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))}catch(e){}
    var pts=o&&Array.isArray(o.points)?o.points:t.split("\n");
    pts=pts.map(function(p){return String(p).replace(/^[\s\-*•\d.)]+/,"").trim()}).filter(Boolean);
    sum.textContent=(o&&o.summary)||"النقط اللي طلعت من كلامك:";
    pts.forEach(function(p,i){
      body.appendChild(h("label",{for:"pt"+i},h("input",{id:"pt"+i,type:"checkbox",value:p,checked:true}),h("span",{text:p})));
    });
    add.disabled=!pts.length;
  },function(e){sum.textContent=aiErr(e)});
}

/* ---------- smart commands ---------- */
function norm(s){return String(s).toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")}
function keywordFind(text){
  var stop=/^(جمع|جمعلي|اجمع|هات|هاتلي|وريني|طلع|طلعلي|كل|مهام|المهام|مهمات|ملاحظات|الملاحظات|بتاعه|بتاعت|بتاع|بتوع|الخاصه|اللي|في|عن|من|لي|ليا|مع|و|عايز|عاوز|شغل|حاجات|الحاجات|تبع|مثلا)$/;
  var words=norm(text).split(/\s+/).filter(function(w){return w.length>1&&!stop.test(w)});
  if(!words.length)return [];
  return S.tasks.filter(function(t){
    var n=norm(t.text);
    return words.some(function(w){return n.indexOf(w)>=0||(w.length>4&&w.indexOf("ال")===0&&n.indexOf(w.slice(2))>=0)});
  }).map(function(t){return t.id});
}
function assistant(text){
  $("text").value="";base="";chip();
  var reply=h("div",{class:"out",text:"بفهم طلبك…","aria-live":"polite"}),body=h("div",{class:"pts"}),extra=h("div",{class:"pts"}),acts=h("div",{class:"btns"});
  openSheet(h("div",{class:"sheet"},h("h3",{text:"«"+text+"»"}),reply,body,extra,acts,
    h("div",{class:"btns"},h("button",{type:"button",class:"btn",text:"قفل",on:{click:closeSheet}}))),true);
  function show(o,note){
    var byId={},names={};
    S.tasks.forEach(function(t){byId[t.id]=t});S.lists.forEach(function(l){names[l.id]=l.name});
    var ids=(Array.isArray(o.taskIds)?o.taskIds:[]).filter(function(id,i,a){return byId[id]&&a.indexOf(id)===i});
    var fresh=(Array.isArray(o.newTasks)?o.newTasks:[]).filter(function(n){return n&&n.text&&names[n.listId]});
    reply.textContent=(o.reply||(ids.length?"دول اللي لقيتهم:":"ملقتش حاجة مطابقة."))+(note?"\n"+note:"");
    function picked(){return [].slice.call(body.querySelectorAll("input:checked")).map(function(c){return c.value})}
    ids.forEach(function(id,i){
      var t=byId[id];
      body.appendChild(h("label",{for:"as"+i},h("input",{id:"as"+i,type:"checkbox",value:id,checked:true}),
        h("span",null,t.text+" ",h("small",{text:"· "+(names[t.listId]||"")+(t.done?" · خلصت":"")}))));
    });
    if(ids.length){
      var nm=h("input",{id:"grpName",type:"text",maxlength:"40",value:o.listName||"",placeholder:"مثلاً: مهام العميل"});
      extra.appendChild(h("label",{for:"grpName",style:"flex-direction:column;border:0;color:var(--muted);font-size:13px;gap:6px"},"اجمعهم في لستة باسم",nm));
      acts.appendChild(h("button",{type:"button",class:"btn main",text:"اجمعهم في اللستة دي",on:{click:function(){
        var p=picked(),name=nm.value.trim();
        if(!p.length||!name){toast("اختار ملاحظات واكتب اسم اللستة.");return}
        var ex=S.lists.filter(function(l){return norm(l.name)===norm(name)})[0],id=ex?ex.id:newId();
        if(!ex)put("lists",id,{name:name,color:S.lists.length%COLORS,order:Date.now()});
        p.forEach(function(tid){if(byId[tid].listId!==id)patch("tasks",tid,{listId:id})});
        S.cur=id;S.fresh=null;closeSheet();render();
      }}}));
      acts.appendChild(h("button",{type:"button",class:"btn",text:"علّم عليهم خلصت",on:{click:function(){
        var p=picked();if(!p.length)return;sound(true);
        p.forEach(function(tid){if(!byId[tid].done)patch("tasks",tid,{done:true,doneAt:Date.now()})});closeSheet();
      }}}));
    }
    if(fresh.length){
      fresh.forEach(function(n){extra.appendChild(h("label",{style:"border:0"},h("span",null,"+ "+n.text+" ",h("small",{text:"· "+names[n.listId]}))))});
      acts.appendChild(h("button",{type:"button",class:"btn main",text:"ضيف "+fresh.length+" ملاحظة",on:{click:function(){
        fresh.forEach(function(n,i){put("tasks",newId(),{listId:n.listId,text:String(n.text),done:false,createdAt:Date.now()+i,doneAt:null})});closeSheet();
      }}}));
    }
  }
  var data=JSON.stringify({lists:S.lists.map(function(l){return {id:l.id,name:l.name}}),
    tasks:S.tasks.map(function(t){return {id:t.id,listId:t.listId,text:t.text,done:!!t.done}})});
  gemini([{text:"إنت مساعد جوه نوتة مهام شخصية. دي كل اللستات والملاحظات بصيغة JSON:\n"+data+"\n\nطلب صاحب النوتة: «"+text+"»\n\nافهم الطلب ورجّع JSON بس من غير أي كلام تاني بالشكل ده:\n{\"reply\":\"رد قصير بالعامية المصرية يجاوب على الطلب أو يشرح اللي لقيته\",\"taskIds\":[\"id لكل ملاحظة موجودة ليها علاقة بالطلب\"],\"listName\":\"اسم قصير مناسب للستة تجمعهم لو الطلب تجميع، وإلا سيبه فاضي\",\"newTasks\":[{\"listId\":\"id لستة موجودة\",\"text\":\"نص ملاحظة جديدة\"}]}\nقواعد: في taskIds دوّر بالمعنى مش بالحرف، يعني لو طلب مهام شخص أو عميل أو موضوع هات كل اللي يخصه حتى لو الاسم مكتوب بشكل مختلف أو فيه غلطة إملائية. newTasks تتملي بس لو طلب صريح إنه يضيف حاجة، واختار أنسب لستة موجودة. استخدم الـ id زي ما هو بالظبط."}])
  .then(function(t){
    var o=null;try{o=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))}catch(e){}
    if(o)show(o);else show({reply:t.replace(/\*\*/g,""),taskIds:[]});
  },function(e){
    var ids=keywordFind(text);
    show({reply:ids.length?"دول اللي فيهم نفس الكلمة (بحث عادي):":"ملقتش الكلمة دي في أي ملاحظة (بحث عادي).",taskIds:ids},aiErr(e));
  });
}

/* ---------- composer + voice ---------- */
var base="",listening=false,rec=null,session="",mr=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function join(a,b){return a&&b?a+" "+b:(a||b||"")}
function hint(msg){$("hint").textContent=msg||"";$("hint").hidden=!msg}
function chip(){$("split").hidden=S.cur===HOME||$("text").value.trim().split(/\s+/).length<7}
function micState(on){
  listening=on;$("mic").classList.toggle("on",on);
  $("mic").setAttribute("aria-label",on?"وقّف التسجيل":"سجّل صوت");
  hint(on?"بسمعك… اتكلم ودوس على الميكروفون لما تخلص.":"");chip();
}
$("text").addEventListener("input",function(){if(!listening)base=$("text").value.trim();chip()});
$("form").addEventListener("submit",function(e){
  e.preventDefault();
  var v=$("text").value.trim();if(!v)return;
  if(listening)stopVoice();
  if(S.cur===HOME){assistant(v);return}
  addTask(v);$("text").value="";base="";S.fresh=null;chip();
});
$("split").addEventListener("click",function(){
  if(listening)stopVoice();
  var v=$("text").value.trim();if(v)splitSheet(v);
});
function startSR(){
  rec=new SR();rec.lang="ar-EG";rec.continuous=false;rec.interimResults=true;session="";
  rec.onresult=function(ev){
    var s="";for(var i=0;i<ev.results.length;i++)s+=ev.results[i][0].transcript;
    session=s.trim();$("text").value=join(base,session);
  };
  rec.onerror=function(ev){
    if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){listening=false;toast("المتصفح مانع الميكروفون. اسمح له من إعدادات الموقع.")}
    else if(ev.error==="network"){listening=false;toast("التسجيل محتاج نت.")}
  };
  rec.onend=function(){
    base=join(base,session);session="";$("text").value=base;
    if(listening){try{startSR()}catch(e){micState(false)}}else micState(false);
  };
  rec.start();
}
function startRec(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var chunks=[];mr=new MediaRecorder(stream);
    mr.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
    mr.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});micState(false);
      var blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"}),fr=new FileReader();
      $("mic").classList.add("busy");hint("بحوّل الصوت لكلام…");
      fr.onload=function(){
        gemini([{text:"اكتب الكلام اللي في التسجيل ده بالحرف زي ما اتقال، من غير أي إضافة أو شرح."},
                {inlineData:{mimeType:blob.type.split(";")[0],data:String(fr.result).split(",")[1]}}])
          .then(function(t){base=join(base,t);$("text").value=base},function(e){toast(aiErr(e))})
          .then(function(){$("mic").classList.remove("busy");hint("");chip()});
      };
      fr.readAsDataURL(blob);
    };
    mr.start();micState(true);
  },function(){toast("المتصفح مانع الميكروفون. اسمح له من إعدادات الموقع.")});
}
function stopVoice(){
  listening=false;
  if(rec){try{rec.stop()}catch(e){}}
  if(mr&&mr.state==="recording")mr.stop();
}
$("mic").addEventListener("click",function(){
  if(listening){stopVoice();return}
  base=$("text").value.trim();
  if(SR){try{micState(true);startSR()}catch(e){micState(false)}}
  else if(!LS.get("nota.gkey"))toast("المتصفح ده مابيحولش الصوت لوحده. حط مفتاح Gemini من الإعدادات وهو يحوّله.");
  else startRec();
});
if(SR||(navigator.mediaDevices&&window.MediaRecorder))$("mic").hidden=false;
else hint("المتصفح ده مفيهوش تسجيل. افتح النوتة من كروم، أو استخدم ميكروفون الكيبورد.");

/* ---------- install as app ---------- */
var installEvt=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();installEvt=e;$("install").hidden=false});
window.addEventListener("appinstalled",function(){installEvt=null;$("install").hidden=true;toast("النوتة نزلت. هتلاقي الأيقونة على الشاشة.")});
$("install").addEventListener("click",function(){
  if(!installEvt)return;
  installEvt.prompt();installEvt.userChoice.then(function(){installEvt=null;$("install").hidden=true},function(){});
});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});

/* ---------- boot ---------- */
(function(){
  var m=/#cfg=([A-Za-z0-9+/=_-]+)/.exec(location.hash);
  if(m){
    try{var c=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(c.apiKey&&c.projectId)LS.set("nota.fb",JSON.stringify(c))}catch(e){}
    try{history.replaceState(null,"",location.pathname+location.search)}catch(e){location.hash=""}
  }
})();
useLocal();render();
if(getCfg())connect();
})();
</script>
